<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatics TCG - Student</title>
    <!-- Firebase SDK (Kompakt für Realtime Database, Version 8.10.1 für einfache Kompatibilität) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #18bc9c; --bg: #ecf0f1; --text: #333; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 10px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background: var(--secondary); color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        .btn:disabled { background: #95a5a6; }
        input { padding: 10px; width: calc(100% - 24px); font-size: 1.2em; text-align: center; margin-bottom: 10px; }
        
        .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .card { border: 2px solid #bdc3c7; border-radius: 5px; padding: 10px; cursor: pointer; user-select: none; }
        .card.selected { border-color: var(--secondary); background: #e8f8f5; }
        .card .emoji { font-size: 2em; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
        
        #view-start, #view-leader, #view-member { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mein Deck</h1>
        
        <!-- START VIEW -->
        <div id="view-start">
            <p>Du hast 3 zufällige Karten im Deck.</p>
            <button class="btn" onclick="createTeam()">Neues Team gründen</button>
            <hr style="margin: 20px 0;">
            <input type="text" id="join-pin" placeholder="Team-PIN (z.B. 1234)">
            <button class="btn" style="background: var(--primary);" onclick="joinTeam()">Team beitreten</button>
        </div>

        <!-- LEADER VIEW -->
        <div id="view-leader">
            <h2>Team: <span id="team-pin-display"></span></h2>
            <p>Lass deine Teammitglieder diesen QR-Code scannen (oder die PIN eingeben):</p>
            <div id="qrcode"></div>
            
            <h3>Team-Karten-Pool (Wähle max 5)</h3>
            <div class="cards-grid" id="pool-grid"></div>
            
            <button class="btn" id="submit-btn" onclick="submitSolution()" disabled>Lösung an Beamer senden</button>
        </div>

        <!-- MEMBER VIEW -->
        <div id="view-member">
            <h2>Verbunden mit Team <span id="member-team-pin"></span></h2>
            <p>Deine Karten wurden dem Team-Leader geschickt. Besprecht euch jetzt!</p>
            <div class="cards-grid" id="my-cards-grid"></div>
        </div>
    </div>

    <script>
        // HIER DEINE ECHTE FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyCyHK3ffOccGryw03jQphYXMpP3tC6Xgpk",
            authDomain: "informatik-tcg.firebaseapp.com",
            projectId: "informatik-tcg",
            // WICHTIG: Ersetzt, je nachdem ob US oder EU. Wenn es nicht geht, ".firebaseio.com" statt "europe-west1.firebasedatabase.app" probieren
            databaseURL: "https://informatik-tcg-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "informatik-tcg.firebasestorage.app",
            messagingSenderId: "212430356994",
            appId: "1:212430356994:web:9a3947fbe34701bfbcdd1b",
            measurementId: "G-J8YP14HRVM"
        };
        
        // Wenn du beim Einrichten der Datenbank als Standort "USA" gewählt hast, nutze diese URL:
        // firebaseConfig.databaseURL = "https://informatik-tcg-default-rtdb.firebaseio.com";

        // Firebase initialisieren (Scharf geschaltet)
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const attributes = ["Theorie", "Software", "Hardware", "Design", "Vision"];
        const allCards = {
            turing: { name: "Alan Turing", emoji: "🕵️‍♂️", stats: { Theorie: 5, Software: 4, Hardware: 3, Design: 1, Vision: 5 } },
            allen: { name: "Frances Allen", emoji: "👩‍💻", stats: { Theorie: 3, Software: 5, Hardware: 3, Design: 1, Vision: 4 } },
            clarke: { name: "Edith Clarke", emoji: "⚡", stats: { Theorie: 5, Software: 1, Hardware: 5, Design: 1, Vision: 4 } },
            ellis: { name: "Clarence Ellis", emoji: "🤝", stats: { Theorie: 3, Software: 4, Hardware: 1, Design: 5, Vision: 5 } },
            kare: { name: "Susan Kare", emoji: "🎨", stats: { Theorie: 1, Software: 2, Hardware: 1, Design: 5, Vision: 4 } }
        };

        // Simuliere lokales Deck
        let myDeck = ["turing", "clarke", "kare"]; 
        let currentRoom = "";
        let isLeader = false;
        
        let teamPool = []; 
        let selectedCards = []; 

        const urlParams = new URLSearchParams(window.location.search);
        const urlRoom = urlParams.get('room');
        
        if(urlRoom) {
            document.getElementById("join-pin").value = urlRoom;
            joinTeam();
        } else {
            document.getElementById("view-start").style.display = "block";
        }

        function createTeam() {
            isLeader = true;
            currentRoom = Math.floor(1000 + Math.random() * 9000).toString(); 
            
            document.getElementById("view-start").style.display = "none";
            document.getElementById("view-leader").style.display = "block";
            document.getElementById("team-pin-display").innerText = currentRoom;

            // QR Code Link generieren
            let joinUrl = window.location.href.split('?')[0] + "?room=" + currentRoom;
            new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 128, height: 128 });

            addCardsToPool(myDeck);

            // ECHTE FIREBASE LOGIK
            db.ref('rooms/' + currentRoom).on('child_added', (snapshot) => {
                let memberCards = snapshot.val();
                addCardsToPool(memberCards);
            });
        }

        function joinTeam() {
            currentRoom = document.getElementById("join-pin").value;
            if(!currentRoom) return;

            document.getElementById("view-start").style.display = "none";
            document.getElementById("view-member").style.display = "block";
            document.getElementById("member-team-pin").innerText = currentRoom;

            let grid = document.getElementById("my-cards-grid");
            myDeck.forEach(c => {
                grid.innerHTML += `<div class="card"><div class="emoji">${allCards[c].emoji}</div><h4>${allCards[c].name}</h4></div>`;
            });

            // ECHTE FIREBASE LOGIK
            let myId = Math.random().toString(36).substring(7);
            db.ref('rooms/' + currentRoom + '/' + myId).set(myDeck);
        }

        function addCardsToPool(cardsArray) {
            let grid = document.getElementById("pool-grid");
            cardsArray.forEach(cardKey => {
                let card = allCards[cardKey];
                let div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `<div class="emoji">${card.emoji}</div><h4>${card.name}</h4>`;
                
                div.onclick = () => {
                    if (div.classList.contains("selected")) {
                        div.classList.remove("selected");
                        selectedCards.splice(selectedCards.indexOf(cardKey), 1);
                    } else {
                        if (selectedCards.length < 5) {
                            div.classList.add("selected");
                            selectedCards.push(cardKey);
                        } else {
                            alert("Maximal 5 Karten pro Team-Lösung!");
                        }
                    }
                    document.getElementById("submit-btn").disabled = selectedCards.length === 0;
                };
                grid.appendChild(div);
            });
        }

        function submitSolution() {
            let teamStats = { Theorie: 0, Software: 0, Hardware: 0, Design: 0, Vision: 0 };
            selectedCards.forEach(key => {
                let s = allCards[key].stats;
                for (let a of attributes) { teamStats[a] += s[a]; }
            });

            // ECHTE FIREBASE LOGIK
            db.ref('leaderboard').push({
                teamPin: currentRoom,
                stats: teamStats
            });
            
            alert("Lösung erfolgreich an den Beamer gesendet!");
            document.getElementById("submit-btn").disabled = true;
            document.getElementById("submit-btn").innerText = "Lösung eingereicht";
        }
    </script>
</body>
</html>
