        :root { --primary: #2c3e50; --secondary: #18bc9c; --bg: #ecf0f1; --text: #333; }

        .login-box button { background: var(--secondary); color: white; border: none; padding: 12px 20px; font-size: 1.1em; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }

        .btn-activate { background: var(--secondary); color: white; }
        .btn-toggle-lb { background: #f39c12; color: white; }

        .header { display: flex; align-items: center; justify-content: center; gap: 60px; margin-bottom: 30px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header-text { text-align: center; }
        .header-text h1 { margin-top: 0; margin-bottom: 5px; color: var(--primary); }
        #main-qrcode { background: white; padding: 10px; border: 2px solid #eee; border-radius: 10px; }

        .timer-box { background: #f8f9fa; padding: 15px 25px; border-radius: 10px; text-align: center; border: 2px solid var(--primary); }
        .timer-display { font-size: 2.5em; font-weight: bold; color: var(--primary); font-family: monospace; margin-bottom: 5px; }
        .timer-controls button { background: var(--primary); color: white; border: none; padding: 5px 10px; margin: 2px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .btn-start { background: var(--secondary) !important; }
        .btn-start:disabled { background: #95a5a6 !important; cursor: not-allowed; }

        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

        .reward-box { background: var(--secondary); color: white; padding: 30px; border-radius: 10px; font-size: 1.4em; text-align: center; height: fit-content; display: none; }
